[package]
name = "stm32h7_ppp_https"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "stm32h7_ppp_https"
path = "src/main.rs"

[profile.release]
opt-level = "s"
debug = true
lto = true

[profile.dev]
opt-level = "s"
debug = true

[dependencies]
# Adjust `stm32h743zi` to your exact part (Nucleo-H743ZI here) -- see
# https://docs.rs/embassy-stm32 for the full chip feature list.
embassy-stm32 = { version = "0.6.0", features = [
    "stm32h743zi",
    "defmt",
    "time-driver-any",
    "memory-x",
    "unstable-pac",
    "rt",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime",
    "tick-hz-32_768",
] }
embassy-net = { version = "0.9.1", default-features = false, features = [
    "defmt",
    "proto-ipv4",
    "medium-ip",
    "tcp",
    "udp",
    "dns",
] }
embassy-sync = "0.8.0"

cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
defmt = "1.1.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-io-async = "0.7.0"
static_cell = "2.1.0"
rand_core = "0.6"

embedded-tls = { version = "0.19.0", default-features = false }
heapless = { version = "0.9.3", default-features = false }

# This crate is the whole point of the example: `embassy` (bare-metal no_std
# backend) + `ppp` (the embassy-net-over-PPP path, see `src/ppp.rs`/`src/net.rs`)
# + `defmt` (this board's logging story -- see the crate's own `net.rs` for why
# `defmt`, not `log`, is what actually shows up over RTT here). `eg916u` matches
# the modem this example was written against; swap to `bg95`/`bg96` if yours differs.
modem-manager-rs = { path = "../../", default-features = false, features = [
    "eg916u",
    "embassy",
    "ppp",
    "defmt",
] }

[patch.crates-io]
# embassy crates move fast and aren't always in lockstep on crates.io; if you
# hit a resolver conflict, pin the whole embassy-* family to one git rev here,
# e.g.:
# embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "..." }
