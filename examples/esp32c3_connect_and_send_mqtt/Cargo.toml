[package]
name = "esp32c3_example"
version = "1.0.0"
edition = "2021"
resolver = "2"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[dependencies]
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
esp-idf-sys = { version = "0.36.1", features = ["binstart"] }
esp-idf-hal = { version = "0.45.0", features = ["adc-oneshot-legacy"] }
esp-idf-svc = { version = "0.51.0", features = [
    "critical-section",
    "embassy-time-driver",
] }
toml-cfg = "0.2.0"
log = { version = "0.4.20" }
modem-manager-rs = { path = "../../" }
atat = { version = "0.24.1", features = [
    "derive",
    "bytes",
    "hex_str_arrays",
    "log",
] }
static_cell = "2.1.0"
embassy-time = { version = "0.4.0", features = ["generic-queue-8"] }

[build-dependencies]
embuild = "0.33.0"
